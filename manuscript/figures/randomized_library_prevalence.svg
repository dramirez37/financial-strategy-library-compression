<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
<title id="title">Observed mechanism prevalence</title>
<desc id="desc">Points are design frequencies; lines are descriptive Wilson 95% intervals with denominators shown.</desc>
