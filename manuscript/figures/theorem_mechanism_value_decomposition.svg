<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img">
<title>Exact strategy-value decomposition</title>
<desc>Operational and generative components stack exactly to total innovation. Data: theorem_mechanism_decomposition_figure.csv.</desc>
<rect width="960" height="600" fill="#FBFCFD"/>
<text x="80" y="42" fill="#25313C" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="600">Exact strategy-value decomposition</text>
<text x="80" y="68" fill="#6B7785" font-family="Helvetica,Arial,sans-serif" font-size="14">Total innovation = operational innovation + generative innovation</text>
<text x="232.0" y="160.0" text-anchor="end" fill="#25313C" font-family="Helvetica,Arial,sans-serif" font-size="15">operational-only</text>
<rect x="250.0" y="120.0" width="442.5" height="70.0" fill="#2563A6"/>
<rect x="692.5" y="120.0" width="0.0" height="70.0" fill="#D97706"/>
<text x="702.5" y="160.0" fill="#25313C" font-family="Helvetica,Arial,sans-serif" font-size="14">total 3//1</text>
<text x="232.0" y="290.0" text-anchor="end" fill="#25313C" font-family="Helvetica,Arial,sans-serif" font-size="15">generative-only</text>
<rect x="250.0" y="250.0" width="0.0" height="70.0" fill="#2563A6"/>
<rect x="250.0" y="250.0" width="590.0" height="70.0" fill="#D97706"/>
<text x="850.0" y="290.0" fill="#25313C" font-family="Helvetica,Arial,sans-serif" font-size="14">total 4//1</text>
<text x="232.0" y="420.0" text-anchor="end" fill="#25313C" font-family="Helvetica,Arial,sans-serif" font-size="15">both-components</text>
<rect x="250.0" y="380.0" width="442.5" height="70.0" fill="#2563A6"/>
<rect x="692.5" y="380.0" width="147.5" height="70.0" fill="#D97706"/>
<text x="850.0" y="420.0" fill="#25313C" font-family="Helvetica,Arial,sans-serif" font-size="14">total 4//1</text>
<rect x="300" y="525" width="18" height="18" fill="#2563A6"/><text x="327" y="539" fill="#25313C" font-family="Helvetica,Arial,sans-serif" font-size="14">Operational</text>
<rect x="475" y="525" width="18" height="18" fill="#D97706"/><text x="502" y="539" fill="#25313C" font-family="Helvetica,Arial,sans-serif" font-size="14">Generative</text>
</svg>
