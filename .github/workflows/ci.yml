name: Reproducibility gates

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean 4 / mathlib
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Restore lockfile-keyed Lean cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: formal/.lake
          key: lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('formal/lean-toolchain') }}-${{ hashFiles('formal/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('formal/lean-toolchain') }}-${{ hashFiles('formal/lake-manifest.json') }}-

      - name: Set up Lean and restore mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          lake-package-directory: formal
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true

      - name: Update lockfile and build
        shell: bash
        run: |
          mkdir -p ci-logs
          set -o pipefail
          {
            cd formal
            lake update
            lake build
          } 2>&1 | tee ci-logs/lean.log
          git diff --exit-code -- formal/lake-manifest.json

      - name: Record Lean diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-logs
          {
            cat formal/lean-toolchain
            lake --version
            lean --version
          } > ci-logs/lean-diagnostics.log 2>&1 || true

      - name: Upload Lean failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lean-failure-logs
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 7

  julia:
    name: Julia 1.12
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Julia
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: '1.12.6'
          arch: x64

      - name: Restore safe Julia caches
        uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
        with:
          cache-name: julia-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('julia/Manifest.toml', 'julia/test/Manifest.toml') }}
          save-always: 'false'
          delete-old-caches: 'false'

      - name: Instantiate and test
        shell: bash
        run: |
          mkdir -p ci-logs
          set -o pipefail
          julia --project=julia -e 'using Pkg; Pkg.instantiate(); Pkg.test()' \
            2>&1 | tee ci-logs/julia.log

      - name: Regenerate exact Lean–Julia fixtures and reject drift
        shell: bash
        run: |
          julia --project=julia julia/scripts/export_exact_fixtures.jl
          git diff --exit-code -- \
            shared/exact_fixtures \
            formal/StrategyInnovation/Fixtures/Generated.lean

      - name: Recompute controlled theorem mechanisms and reject drift
        shell: bash
        run: |
          julia --project=julia \
            julia/scripts/run_theorem_mechanism_experiments.jl --check

      - name: Record Julia diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-logs
          julia --version > ci-logs/julia-diagnostics.log 2>&1 || true

      - name: Upload Julia failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: julia-failure-logs
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 7

  latex:
    name: LaTeX
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned-distribution LaTeX tools
        shell: bash
        run: |
          mkdir -p ci-logs
          set -o pipefail
          {
            sudo apt-get update
            sudo apt-get install --no-install-recommends latexmk ripgrep texlive-latex-base texlive-latex-extra lmodern
          } 2>&1 | tee ci-logs/latex-install.log

      - name: Compile manuscript
        shell: bash
        run: |
          set -o pipefail
          ./manuscript/build.sh 2>&1 | tee ci-logs/latex-build.log

      - name: Record LaTeX diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-logs
          {
            latexmk --version
            pdflatex --version
            bibtex --version
          } > ci-logs/latex-diagnostics.log 2>&1 || true

      - name: Upload LaTeX failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: latex-failure-logs
          path: |
            ci-logs/
            manuscript/build/*.log
          if-no-files-found: warn
          retention-days: 7
