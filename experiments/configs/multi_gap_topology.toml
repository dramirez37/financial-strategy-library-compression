schema_version = "multi-gap-topology-v1"
experiment_id = "multi-gap-topology-audit-v1"
arithmetic = "Rational{BigInt}"

[required_example]
belief_states = 5
left_candidate_gap = [4, 0, 0, 0, 0]
right_candidate_gap = [0, 0, 0, 0, 4]
research_cost = [1, 1, 1, 1, 1]
strict_coverage = true

[kernel]
name = "degree-four Bernstein/binomial"
current_probabilities = ["0//1", "1//4", "1//2", "3//4", "1//1"]
future_state = "success count in four Bernoulli signals"

[variation_audit]
input_grid = [-2, -1, 0, 1, 2]
sign_convention = "delete zeros before counting adjacent sign changes"
all_square_minors = true

[component_audit]
gap_grid = [0, 1, 2, 3, 4]
threshold_grid = ["0//1", "1//2", "1//1", "3//2", "2//1", "5//2", "3//1", "7//2", "4//1"]
strict_superlevel = true

[cost_boundary]
constant_gap = [2, 2, 2, 2, 2]
variable_cost = [0, 3, 0, 3, 0]
